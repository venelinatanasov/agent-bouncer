devices:
  - name: paloalto-test
    listen:
      host: 127.0.0.1
      port: 2201
    remote:
      host: 203.0.113.120
      port: 22
    mode: shell-line
    # Session-preference commands, not config changes — safe to run automatically.
    # scripting-mode is fine here: Tab/"?" aren't supported by the proxy
    # anyway (see docs/USER_MANUAL.md), so there's no downside to the
    # quieter, more automation-friendly output it produces.
    init_commands:
      - "set cli pager off"
      - "set cli scripting-mode on"
    allow:
      - "show system info"
      - "show clock"
      - "show interface *"
      - "show arp all"
      - "show session info"
    log_file: "logs/paloalto-test.log"
