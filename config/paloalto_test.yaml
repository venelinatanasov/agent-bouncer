devices:
  - name: paloalto-test
    listen:
      host: 127.0.0.1
      port: 2201
    remote:
      host: 203.0.113.120
      port: 22
    mode: shell-line
    # Session-preference commands, not config changes — safe to run automatically.
    # Deliberately NOT setting "scripting-mode on": it suppresses Tab
    # completion and "?" help, which we want to keep working interactively.
    init_commands:
      - "set cli pager off"
    allow:
      - "show system info"
      - "show clock"
      - "show interface *"
      - "show arp all"
      - "show session info"
    log_file: "logs/paloalto-test.log"
